
name: Mirror to neuro-physics

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repository
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git clone --mirror \
            https://github.com/mgirardis/mgirardis.github.io.git \
            repo.git

          git -C repo.git push --mirror \
            "https://x-access-token:${TOKEN}@github.com/neuro-physics/neuro-physics.github.io.git"

      #- name: Set organization domain
