      - name: Trigger organization deployment
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/neuro-physics/neuro-physics.github.io/actions/workflows/jekyll.yml/dispatches \
            -d '{"ref":"main"}'